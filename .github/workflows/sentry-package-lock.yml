name: Temporary Sentry lockfile

on:
  push:
    branches: [feat/calendaria-dev-sentry]

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[sentry-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install Sentry SDK and update lockfile
        run: npm install --save-exact @sentry/node@10.75.0
      - name: Commit package metadata
        run: |
          if git diff --quiet package.json package-lock.json; then exit 0; fi
          git config user.name "CalendarIA CI"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add Sentry Node SDK [sentry-lock]"
          git push origin HEAD:${GITHUB_REF_NAME}
