name: Temporary domain and Sentry patch

on:
  push:
    branches:
      - feat/calendaria-dev-sentry

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[domain-sentry-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply patch
        run: python scripts/apply-domain-sentry-patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "CalendarIA CI"
          git config user.email "actions@users.noreply.github.com"
          git add README.md public/index.html public/welcome.html public/privacy.html scripts/patch-open-graph.js render.yaml scripts/check-syntax.js server.js
          git commit -m "Configure calendaria.dev and Sentry [domain-sentry-patch]"
          git push origin HEAD:${GITHUB_REF_NAME}
