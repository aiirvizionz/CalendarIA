        <path d="M974 478v-39c0-66-49-108-113-108H392c-67 0-113 45-113 113v385c0 70 48 116 118 116h171c59 0 91-28 119-86 28-60 69-91 132-91h35"/>
        <path d="M279 331h582"/>
        <path d="M655 873c44-91 83-132 164-132h31c51 0 89-20 116-59"/>
        <path d="M743 948v-19c0-45 35-78 80-78h83"/>
      </g>
      <g fill="#0b0c0e">
        <rect x="395" y="502" width="49" height="49" rx="12"/><rect x="522" y="502" width="49" height="49" rx="12"/><rect x="649" y="502" width="49" height="49" rx="12"/>
        <rect x="395" y="623" width="49" height="49" rx="12"/><rect x="522" y="623" width="49" height="49" rx="12"/><rect x="649" y="623" width="49" height="49" rx="12"/>
        <rect x="395" y="744" width="49" height="49" rx="12"/><rect x="522" y="744" width="49" height="49" rx="12"/>
        <path d="M847 462c12 45 36 69 81 81-45 12-69 36-81 81-12-45-36-69-81-81 45-12 69-36 81-81Z"/>
        <circle cx="955" cy="654" r="54"/><circle cx="952" cy="865" r="54"/>
      </g>
      <circle cx="955" cy="654" r="22" fill="#fffdf9"/><circle cx="952" cy="865" r="22" fill="#fffdf9"/>
    </g>
  </g>

  <text x="184" y="113" fill="#f7f4ef" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Calendar<tspan fill="#c8c9ff">IA</tspan></text>
  <text x="76" y="238" fill="#f7f4ef" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">Tu agenda,</text>
  <text x="76" y="312" fill="#f7f4ef" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">más inteligente.</text>
  <text x="78" y="372" fill="#aaa9a6" font-family="Arial, Helvetica, sans-serif" font-size="28">Convierte texto, imágenes y voz en eventos</text>
  <text x="78" y="410" fill="#aaa9a6" font-family="Arial, Helvetica, sans-serif" font-size="28">revisables para Google Calendar.</text>

  <g transform="translate(76 470)">
    <rect width="206" height="54" rx="27" fill="#f4f0eb"/>
    <text x="103" y="35" text-anchor="middle" fill="#15161a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Texto o imagen</text>
    <rect x="220" width="116" height="54" rx="27" fill="#17191d" stroke="#fff" stroke-opacity=".14"/>
    <text x="278" y="35" text-anchor="middle" fill="#f4f0eb" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Voz</text>
  </g>

  <g transform="translate(680 84) rotate(-2 220 230)" filter="url(#shadow)">
