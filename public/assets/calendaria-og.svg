<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CalendarIA — Agenda inteligente</title>
  <desc id="desc">Vista previa social de CalendarIA con una interfaz oscura, el logotipo del proyecto y tarjetas de eventos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090a0d"/>
      <stop offset="0.55" stop-color="#111318"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5f1"/>
      <stop offset="1" stop-color="#e9e4de"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a7adff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#a7adff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="290" fill="url(#glow)"/>
  <circle cx="120" cy="570" r="250" fill="url(#glow)" opacity=".42"/>
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#fff" stroke-opacity=".09"/>

