    <rect x="24" y="24" width="390" height="68" rx="18" fill="#111316"/>
    <text x="58" y="67" fill="#f5f1eb" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Tus próximos eventos</text>

    <g transform="translate(28 118)">
      <rect width="382" height="96" rx="21" fill="#f8f5f1" stroke="#1b1d21" stroke-opacity=".12"/>
      <rect x="18" y="18" width="5" height="60" rx="3" fill="#17191d"/>
      <text x="42" y="43" fill="#17191d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Examen de redes</text>
      <text x="42" y="71" fill="#77767a" font-family="Arial, Helvetica, sans-serif" font-size="17">Mañana · 10:00 a.m.</text>
      <rect x="275" y="25" width="80" height="34" rx="17" fill="#dfece7"/>
      <text x="315" y="48" text-anchor="middle" fill="#267a60" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Google</text>
    </g>

    <g transform="translate(28 229)">
      <rect width="382" height="96" rx="21" fill="#f8f5f1" stroke="#1b1d21" stroke-opacity=".12"/>
      <rect x="18" y="18" width="5" height="60" rx="3" fill="#6d65b8"/>
      <text x="42" y="43" fill="#17191d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Clase de inglés</text>
      <text x="42" y="71" fill="#77767a" font-family="Arial, Helvetica, sans-serif" font-size="17">Sábado · 12:00 p.m.</text>
      <rect x="275" y="25" width="80" height="34" rx="17" fill="#dfece7"/>
      <text x="315" y="48" text-anchor="middle" fill="#267a60" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Google</text>
    </g>

    <g transform="translate(28 340)">
      <rect width="382" height="90" rx="21" fill="#111316"/>
      <text x="28" y="38" fill="#f5f1eb" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Analiza con Gemini</text>
      <text x="28" y="66" fill="#aaa9a6" font-family="Arial, Helvetica, sans-serif" font-size="15">Revisa y confirma antes de guardar.</text>
      <path d="M335 25c5 20 15 30 35 35-20 5-30 15-35 35-5-20-15-30-35-35 20-5 30-15 35-35Z" fill="#f5f1eb"/>
    </g>
  </g>
